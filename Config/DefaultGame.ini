+MapsToCook=(FilePath="/Stereolabs/Samples/Levels/L_ObjectDetection_3D")
+MapsToCook=(FilePath="/Stereolabs/Samples/Levels/L_OpenNewLevel")
+MapsToCook=(FilePath="/Stereolabs/Samples/Levels/L_Passthrough")
+MapsToCook=(FilePath="/Stereolabs/Samples/Levels/L_PlaneDetection")
+MapsToCook=(FilePath="/Stereolabs/Samples/Levels/L_PointCloud")
